[package]
name = "clipkeep-gateway"
version = "0.1.6"
edition = "2021"
rust-version = "1.82"
description = "ClipKeep 网页版网关：DTK 反代 + 静态托管 + 媒体下载"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
  "fs",
  "compression-gzip",
  "set-header",
  "trace",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "http2",
  "charset",
  "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

# 体积优先：单文件二进制要在 musl 下保持小巧。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
